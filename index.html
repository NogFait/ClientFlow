<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Marks "JS is running" before first paint. ScrollReveal only hides
         sections under :root.js, so the prerendered HTML is fully visible for
         crawlers and no-JS visitors, and a deferred module script (which runs
         after first paint) can't cause a visible-then-hidden flash. -->
    <script>document.documentElement.classList.add("js")</script>

    <title>ClientFlow — CRM para freelancers</title>
    <meta
      name="description"
      content="Tus clientes, proyectos y cobros en un solo lugar. Gratis hasta 3 clientes, sin tarjeta."
    />
    <link rel="canonical" href="https://clientflow.lat/" />
    <meta name="theme-color" content="#7c3aed" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClientFlow" />
    <meta property="og:title" content="ClientFlow — CRM para freelancers" />
    <meta
      property="og:description"
      content="Tus clientes, proyectos y cobros en un solo lugar. Gratis hasta 3 clientes, sin tarjeta."
    />
    <meta property="og:url" content="https://clientflow.lat/" />
    <meta property="og:image" content="https://clientflow.lat/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_AR" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClientFlow — CRM para freelancers" />
    <meta
      name="twitter:description"
      content="Tus clientes, proyectos y cobros en un solo lugar. Gratis hasta 3 clientes, sin tarjeta."
    />
    <meta name="twitter:image" content="https://clientflow.lat/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ClientFlow",
        "url": "https://clientflow.lat",
        "logo": "https://clientflow.lat/icon-512.png",
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "hola@clientflow.lat",
          "contactType": "customer support"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ClientFlow",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://clientflow.lat",
        "inLanguage": "es",
        "offers": [
          {
            "@type": "Offer",
            "name": "Free",
            "price": "0",
            "priceCurrency": "USD"
          },
          {
            "@type": "Offer",
            "name": "Pro",
            "price": "12",
            "priceCurrency": "USD",
            "billingIncrement": "1",
            "billingDuration": "P1M"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
